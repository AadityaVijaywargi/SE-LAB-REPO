<svg width="900" height="640" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#444"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

  <text x="450" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">
    UML Use-Case Diagram — Student Club Event Ticketing &amp; Budget Portal
  </text>

  <!-- System boundary -->
  <rect x="150" y="45" width="610" height="560" rx="6" fill="#fafafa" stroke="#333" stroke-width="1.5"/>
  <text x="455" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">
    Student Club Event Ticketing &amp; Budget Portal (System)
  </text>

  <!-- ============ Actor: Club Lead (left) ============ -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <circle cx="60" cy="150" r="14" fill="#ffffff"/>
    <line x1="60" y1="164" x2="60" y2="210"/>
    <line x1="35" y1="180" x2="85" y2="180"/>
    <line x1="60" y1="210" x2="38" y2="245"/>
    <line x1="60" y1="210" x2="82" y2="245"/>
  </g>
  <text x="60" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Club Lead</text>

  <!-- ============ Actor: Campus Admin (right) ============ -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <circle cx="840" cy="150" r="14" fill="#ffffff"/>
    <line x1="840" y1="164" x2="840" y2="210"/>
    <line x1="815" y1="180" x2="865" y2="180"/>
    <line x1="840" y1="210" x2="818" y2="245"/>
    <line x1="840" y1="210" x2="862" y2="245"/>
  </g>
  <text x="840" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Campus Admin</text>
  <text x="840" y="281" text-anchor="middle" font-size="10" fill="#555">(incl. Faculty Coord.,</text>
  <text x="840" y="294" text-anchor="middle" font-size="10" fill="#555">Finance Office, Dean)</text>

  <!-- ============ Use case ovals ============ -->
  <!-- Submit Event Proposal -->
  <ellipse cx="300" cy="110" rx="115" ry="34" fill="#e8f0fe" stroke="#2255aa" stroke-width="1.5"/>
  <text x="300" y="106" text-anchor="middle" font-size="12" fill="#12305c">Submit Event</text>
  <text x="300" y="121" text-anchor="middle" font-size="12" fill="#12305c">Proposal</text>

  <!-- Request Budget Approval -->
  <ellipse cx="300" cy="210" rx="115" ry="34" fill="#e8f0fe" stroke="#2255aa" stroke-width="1.5"/>
  <text x="300" y="206" text-anchor="middle" font-size="12" fill="#12305c">Request Budget</text>
  <text x="300" y="221" text-anchor="middle" font-size="12" fill="#12305c">Approval</text>

  <!-- Route Approval Workflow (included) -->
  <ellipse cx="300" cy="320" rx="125" ry="34" fill="#fff4e0" stroke="#a66a00" stroke-width="1.5"/>
  <text x="300" y="316" text-anchor="middle" font-size="12" fill="#663f00">Route Approval</text>
  <text x="300" y="331" text-anchor="middle" font-size="12" fill="#663f00">Workflow</text>

  <!-- Submit Expense Report -->
  <ellipse cx="300" cy="430" rx="125" ry="34" fill="#e8f0fe" stroke="#2255aa" stroke-width="1.5"/>
  <text x="300" y="426" text-anchor="middle" font-size="12" fill="#12305c">Submit Expense</text>
  <text x="300" y="441" text-anchor="middle" font-size="12" fill="#12305c">Report</text>

  <!-- Generate QR Tickets -->
  <ellipse cx="620" cy="110" rx="115" ry="34" fill="#e8f0fe" stroke="#2255aa" stroke-width="1.5"/>
  <text x="620" y="106" text-anchor="middle" font-size="12" fill="#12305c">Generate QR</text>
  <text x="620" y="121" text-anchor="middle" font-size="12" fill="#12305c">Tickets</text>

  <!-- Scan Ticket at Check-in -->
  <ellipse cx="620" cy="230" rx="120" ry="34" fill="#e8f0fe" stroke="#2255aa" stroke-width="1.5"/>
  <text x="620" y="226" text-anchor="middle" font-size="12" fill="#12305c">Scan Ticket at</text>
  <text x="620" y="241" text-anchor="middle" font-size="12" fill="#12305c">Check-in</text>

  <!-- Flag Invalid/Duplicate Entry (extend) -->
  <ellipse cx="620" cy="345" rx="130" ry="34" fill="#ffe8ee" stroke="#a3184a" stroke-width="1.5"/>
  <text x="620" y="341" text-anchor="middle" font-size="12" fill="#5c0e2b">Flag Invalid /</text>
  <text x="620" y="356" text-anchor="middle" font-size="12" fill="#5c0e2b">Duplicate Entry</text>

  <!-- ============ Actor associations (solid lines) ============ -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="88" y1="160" x2="192" y2="115"/>
    <line x1="88" y1="180" x2="185" y2="210"/>
    <line x1="88" y1="220" x2="180" y2="415"/>

    <line x1="812" y1="160" x2="710" y2="115"/>
    <line x1="812" y1="200" x2="720" y2="228"/>
  </g>

  <!-- ============ <<include>> relationship ============ -->
  <line x1="300" y1="244" x2="300" y2="286" stroke="#a66a00" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="345" y="268" font-size="11" font-style="italic" fill="#a66a00">&lt;&lt;include&gt;&gt;</text>

  <!-- ============ <<extend>> relationship ============ -->
  <line x1="620" y1="311" x2="620" y2="264" stroke="#a3184a" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="670" y="292" font-size="11" font-style="italic" fill="#a3184a">&lt;&lt;extend&gt;&gt;</text>

  <!-- ============ Legend ============ -->
  <g>
    <rect x="170" y="565" width="14" height="14" fill="#e8f0fe" stroke="#2255aa"/>
    <text x="190" y="576" font-size="11" fill="#333">Primary use case</text>

    <rect x="330" y="565" width="14" height="14" fill="#fff4e0" stroke="#a66a00"/>
    <text x="350" y="576" font-size="11" fill="#333">Included use case</text>

    <rect x="490" y="565" width="14" height="14" fill="#ffe8ee" stroke="#a3184a"/>
    <text x="510" y="576" font-size="11" fill="#333">Extending use case</text>
  </g>
</svg>
